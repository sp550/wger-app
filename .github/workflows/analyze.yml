name: Analyze
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Run analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Common flutter setup
        uses: ./.github/actions/flutter-common

      - name: Analyze
        run: flutter analyze

      - name: Check locale lists are in sync
        run: dart run tool/check_locales.dart
