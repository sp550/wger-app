name: Continous Integration
on:
  workflow_dispatch:
  push:
    paths:
      - '**.dart'
      - 'pubspec.yaml'
  pull_request:
    branches: [ master, ]
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - '.github/actions/flutter-common/action.yml'
      - '.github/workflows/ci.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7

      - name: Common flutter setup
        uses: ./.github/actions/flutter-common

      - name: Install system dependencies
        run: sudo apt install libsqlite3-dev --no-install-recommends

      - name: Test app
        run: flutter test --total-shards 4 --shard-index ${{ matrix.shard }}
