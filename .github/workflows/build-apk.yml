name: Build APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag to build'
        required: true
        default: 'master'
      build_release:
        description: 'Build release APK (requires signing secrets)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Common flutter setup
        uses: ./.github/actions/flutter-common

      - name: Patch legacy plugin Kotlin/AGP in pub cache
        run: bash tool/ci/patch_pub_cache.sh

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare release signing
        if: ${{ inputs.build_release != false }}
        env:
          KS_B64: ${{ secrets.WGER_RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.WGER_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WGER_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.WGER_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::WGER_RELEASE_KEYSTORE_B64 secret missing — set the 4 WGER_RELEASE_* secrets or dispatch with build_release=false"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/fork-release.jks
          mkdir -p fastlane/metadata/envfiles
          cat > fastlane/metadata/envfiles/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=../fork-release.jks
          EOF
          ls -l android/fork-release.jks fastlane/metadata/envfiles/key.properties

      - name: Build release APK
        if: ${{ inputs.build_release != false }}
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: wger-app-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
